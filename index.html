<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DOOM 3D — Raycaster</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Courier New',monospace; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  #game { width:100vw; height:100vh; object-fit:cover; image-rendering:pixelated; cursor:crosshair; background:#000; display:block; }
  #damage-flash { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 30%, rgba(255,0,0,.65) 100%); opacity:0; transition:opacity .1s; z-index:5; }
  #heal-flash { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,255,100,.35) 100%); opacity:0; transition:opacity .3s; z-index:5; }
  #crosshair { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6; pointer-events:none; color:#ff2222; font-size:22px; font-weight:bold; text-shadow:0 0 4px #000, 0 0 2px #000; line-height:1; }
  #crosshair .dot { font-size:10px; display:block; text-align:center; }
  /* HUD */
  #hud { position:fixed; left:0; right:0; bottom:0; height:86px; z-index:10; display:flex; align-items:stretch; justify-content:center; gap:0; background:linear-gradient(to bottom,#3a3a3a 0%,#2a2a2a 8%,#1a1a1a 20%,#0d0d0d 100%); border-top:3px solid #555; box-shadow:0 -2px 20px rgba(255,60,0,.25); pointer-events:none; }
  .hud-box { flex:1; max-width:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:2px solid #333; padding:4px; }
  .hud-box:last-child { border-right:none; }
  .hud-label { color:#ff8833; font-size:11px; font-weight:bold; letter-spacing:2px; }
  .hud-val { color:#ff2222; font-size:34px; font-weight:bold; text-shadow:2px 2px 0 #400; line-height:1; font-family:Impact,'Courier New',monospace; }
  .hud-val.ammo { color:#ffcc00; text-shadow:2px 2px 0 #440; }
  .hud-val.armor { color:#33aaff; text-shadow:2px 2px 0 #024; }
  #face { font-size:40px; line-height:1; filter:drop-shadow(2px 2px 0 #000); }
  #weapon-name { color:#aaa; font-size:12px; letter-spacing:1px; }
  #killcount { color:#ff4444; }
  /* top bar */
  #topbar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; justify-content:space-between; align-items:flex-start; padding:8px 10px; pointer-events:none; }
  #msg { color:#ffcc00; font-size:15px; font-weight:bold; text-shadow:1px 1px 0 #000, 0 0 8px #000; text-align:center; flex:1; }
  #minimap { border:2px solid #555; background:rgba(0,0,0,.75); image-rendering:pixelated; }
  #fps { color:#0f0; font-size:11px; text-shadow:1px 1px 0 #000; text-align:right; min-width:60px; }
  /* overlays */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; }
  #title { background:radial-gradient(ellipse at 50% 30%, #4a0a0a 0%, #1a0202 50%, #000 100%); }
  #title h1 { font-family:Impact,sans-serif; font-size:min(96px,16vw); color:#cc0000; letter-spacing:8px; text-shadow:4px 4px 0 #400, 8px 8px 0 #000, 0 0 40px #f00; transform:scaleY(1.3); }
  #title h2 { color:#ff8833; letter-spacing:6px; font-size:min(22px,4vw); margin:6px 0 18px; text-shadow:2px 2px 0 #000; }
  #title p { color:#bbb; font-size:14px; line-height:1.8; max-width:640px; padding:0 20px; }
  #title .keys { color:#ffcc00; }
  .bigbtn { margin-top:22px; font-family:Impact,sans-serif; font-size:28px; letter-spacing:3px; color:#fff; background:linear-gradient(#cc0000,#660000); border:3px solid #ff6633; padding:12px 54px; cursor:pointer; text-shadow:2px 2px 0 #000; box-shadow:0 0 25px rgba(255,0,0,.5); }
  .bigbtn:hover { background:linear-gradient(#ff2222,#880000); transform:scale(1.05); }
  #end { background:rgba(0,0,0,.88); display:none; }
  #end h1 { font-family:Impact,sans-serif; font-size:min(72px,13vw); letter-spacing:6px; }
  #end p { color:#ddd; font-size:16px; margin:12px; line-height:2; }
  #hint { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); z-index:9; color:#fff; background:rgba(0,0,0,.6); padding:6px 14px; font-size:13px; border:1px solid #555; pointer-events:none; display:none; }
  /* touch */
  #touch-ui { position:fixed; inset:0; z-index:15; pointer-events:none; display:none; }
  #stick { position:absolute; left:20px; bottom:110px; width:120px; height:120px; border:2px solid rgba(255,255,255,.4); border-radius:50%; pointer-events:auto; }
  #nub { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; background:rgba(255,255,255,.35); border-radius:50%; }
  #btn-fire { position:absolute; right:24px; bottom:130px; width:92px; height:92px; border-radius:50%; background:rgba(255,30,30,.55); border:3px solid #fff; color:#fff; font-weight:bold; font-size:18px; pointer-events:auto; }
  #btn-use { position:absolute; right:130px; bottom:110px; width:60px; height:60px; border-radius:50%; background:rgba(255,200,0,.45); border:2px solid #fff; color:#fff; font-weight:bold; pointer-events:auto; }
  @media (max-width:700px){ .hud-box{max-width:none} .hud-val{font-size:24px} #face{font-size:30px} #hud{height:70px} }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="damage-flash"></div>
<div id="heal-flash"></div>
<div id="crosshair">+<span class="dot">·</span></div>
<div id="topbar">
  <canvas id="minimap" width="144" height="144"></canvas>
  <div id="msg"></div>
  <div id="fps"></div>
</div>
<div id="hint"></div>
<div id="hud">
  <div class="hud-box"><div class="hud-label">AMMO</div><div class="hud-val ammo" id="h-ammo">50</div><div id="weapon-name">PISTOL</div></div>
  <div class="hud-box"><div class="hud-label">HEALTH</div><div class="hud-val" id="h-hp">100%</div></div>
  <div class="hud-box"><div id="face">😐</div><div class="hud-label" id="killcount">KILLS 0/0</div></div>
  <div class="hud-box"><div class="hud-label">ARMOR</div><div class="hud-val armor" id="h-armor">0%</div></div>
</div>
<div id="touch-ui">
  <div id="stick"><div id="nub"></div></div>
  <button id="btn-fire">FIRE</button>
  <button id="btn-use">USE</button>
</div>
<div id="title" class="overlay">
  <h1>DOOM 3D</h1>
  <h2>★ HELL OUTPOST ★</h2>
  <p>
    악마들이 전초기지를 점령했다. 탈출구(<span class="keys">초록색 EXIT 문</span>)를 찾아 탈출하라!<br>
    <span class="keys">WASD</span> 이동 · <span class="keys">마우스</span> 조준(클릭=포인터락) · <span class="keys">클릭/스페이스</span> 발사 ·
    <span class="keys">1/2/3</span> 무기 · <span class="keys">E</span> 문열기 · <span class="keys">SHIFT</span> 달리기 · <span class="keys">M</span> 맵
  </p>
  <p style="color:#ff6666">◉ 권총 / 산탄총 / 체인건 &nbsp; ◉ 빨간 악마·분홍 악마·날으는 눈알 주의 &nbsp; ◉ 탄약·메드킷 파밍</p>
  <button class="bigbtn" id="btn-start">▶ START</button>
  <p style="margin-top:10px;font-size:12px;color:#777">Chrome/Edge 권장 · 소리 켜기 🔊</p>
</div>
<div id="end" class="overlay">
  <h1 id="end-title">YOU DIED</h1>
  <p id="end-stats"></p>
  <button class="bigbtn" id="btn-retry">↻ RETRY</button>
</div>

<script>
'use strict';
/* ============================================================
   DOOM 3D — single-file raycaster
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const HALF_H = H >> 1;
const FOV = Math.PI / 3;            // 60도
const HALF_FOV = FOV / 2;
const NUM_RAYS = 480;               // 성능/품질 균형 (2px per ray)
const COL_W = W / NUM_RAYS;
const DEPTH_MAX = 24;

// ---------- 맵 ----------
// 1~6: 벽종류, D:문, E:탈출문, .:빈공간
const RAW_MAP = [
"111111111111111111111111",
"1P....1.......2.......E1",
"1.....1................1",
"1.....1....3333........1",
"1.....2....3..3...111..1",
"1.....1....3..3...1....1",
"111.111....3333...1.5.11",
"1.....1......1.....1...1",
"1.....4444...1....11.111",
"1.....4......2.....1...1",
"1.....4444...1.....1...1",
"1.......1...1......1...1",
"1..11...1...11111..1...1",
"1..1........1.....555..1",
"1..1...22...1.....5....1",
"1..11111....1.....555..1",
"1......1....1.........11",
"1......D....D....D....11",
"1......1....1......6...1",
"1..222.22222...66666...1",
"1..2.......2...6...6...1",
"1..2..111..2...6...6..D1",
"1.....111..........6...1",
"111111111111111111111111",
];
const MW = RAW_MAP[0].length, MH = RAW_MAP.length;
let grid = [];       // 0 empty, 1-6 wall, 7 door(closed amount), 8 exit
let doors = [];      // {x,y,open:0..1,opening}
function buildGrid(){
  grid = []; doors = [];
  for(let y=0;y<MH;y++){
    grid[y]=[];
    for(let x=0;x<MW;x++){
      const c = (RAW_MAP[y] && RAW_MAP[y][x]) || '1';
      if(c==='.'||c==='P'){ grid[y][x]=0; }
      else if(c==='D'){ grid[y][x]=7; doors.push({x,y,open:0,opening:false}); }
      else if(c==='E'){ grid[y][x]=8; }
      else if(c>='1'&&c<='6'){ grid[y][x]=parseInt(c); }
      else grid[y][x]=1;
    }
  }
}
function playerStart(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++)
    if(RAW_MAP[y][x]==='P') return {x:x+0.5, y:y+0.5};
  return {x:2.5,y:2.5};
}
function isSolid(x,y){
  const ix=Math.floor(x), iy=Math.floor(y);
  if(ix<0||iy<0||ix>=MW||iy>=MH) return true;
  const v=grid[iy][ix];
  if(v===0) return false;
  if(v===7){
    const d=doors.find(d=>d.x===ix&&d.y===iy);
    return !(d&&d.open>0.65);
  }
  return true;
}
function hasLOS(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0;
  const dist=Math.hypot(dx,dy);
  const steps=Math.ceil(dist*8);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(isSolid(x0+dx*t, y0+dy*t)) return false;
  }
  return true;
}

// ---------- 텍스처 생성 (64x64) ----------
const TEX=64;
function texCanvas(fn){ const c=document.createElement('canvas'); c.width=c.height=TEX; fn(c.getContext('2d')); return c; }
const wallTex = [];
function buildTextures(){
  // 1: 회색 브릭
  wallTex[1]=texCanvas(g=>{
    g.fillStyle='#6a6a6e'; g.fillRect(0,0,64,64);
    for(let y=0;y<8;y++)for(let x=0;x<4;x++){
      const off=(y%2)*16;
      g.fillStyle=`rgb(${90+Math.random()*20|0},${88+Math.random()*15|0},${90+Math.random()*15|0})`;
      g.fillRect(x*32+off-16+1,y*8+1,30,6);
    }
    g.fillStyle='rgba(0,0,0,.35)'; for(let i=0;i<120;i++) g.fillRect(Math.random()*64|0,Math.random()*64|0,1,1);
  });
  // 2: 녹슨 철판
  wallTex[2]=texCanvas(g=>{
    g.fillStyle='#5a4632'; g.fillRect(0,0,64,64);
    g.fillStyle='#6e5740'; for(let i=0;i<4;i++) g.fillRect(0,i*16+2,64,12);
    g.fillStyle='#2c2318'; for(let i=0;i<4;i++) g.fillRect(0,i*16,64,2);
    g.fillStyle='#c96a1e'; for(let i=0;i<26;i++){ g.globalAlpha=.5; g.fillRect(Math.random()*64|0,Math.random()*64|0,3,2);} g.globalAlpha=1;
    g.fillStyle='#222'; [[8,8],[56,8],[8,56],[56,56]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],2,0,7);g.fill();});
  });
  // 3: 피묻은 벽 + 오컬트
  wallTex[3]=texCanvas(g=>{
    g.fillStyle='#4e4e55'; g.fillRect(0,0,64,64);
    g.fillStyle='#3a3a40'; g.fillRect(0,0,64,64);
    g.strokeStyle='#15151a'; g.lineWidth=2;
    for(let i=0;i<=4;i++){ g.beginPath();g.moveTo(i*16,0);g.lineTo(i*16,64);g.stroke(); g.beginPath();g.moveTo(0,i*16);g.lineTo(64,i*16);g.stroke(); }
    g.fillStyle='#a00'; for(let i=0;i<40;i++){ const x=Math.random()*64|0,y=Math.random()*64|0; g.fillRect(x,y,2+Math.random()*4|0,2+Math.random()*5|0); }
    g.strokeStyle='#c00'; g.lineWidth=2; g.beginPath(); g.arc(32,32,14,0,7); g.stroke();
    g.beginPath(); g.moveTo(32,18); g.lineTo(32,46); g.moveTo(18,32); g.lineTo(46,32); g.stroke();
  });
  // 4: 테크 패널 초록
  wallTex[4]=texCanvas(g=>{
    g.fillStyle='#1d2b22'; g.fillRect(0,0,64,64);
    g.fillStyle='#2c4436'; g.fillRect(4,4,56,20); g.fillRect(4,28,26,32); g.fillRect(34,28,26,32);
    g.fillStyle='#39ff88'; g.fillRect(8,8,20,3); g.fillRect(8,14,12,3);
    g.fillStyle='#0a5'; for(let i=0;i<6;i++) g.fillRect(38+i*4,32,2,10+Math.random()*14|0);
    g.strokeStyle='#000'; g.strokeRect(4,4,56,20); g.strokeRect(4,28,26,32); g.strokeRect(34,28,26,32);
  });
  // 5: 갈색 나무/상자
  wallTex[5]=texCanvas(g=>{
    g.fillStyle='#6b4a26'; g.fillRect(0,0,64,64);
    for(let i=0;i<8;i++){ g.fillStyle=i%2?'#75522c':'#63411f'; g.fillRect(0,i*8,64,7); }
    g.fillStyle='rgba(0,0,0,.4)'; for(let y=0;y<64;y+=2) g.fillRect(0,y,64,1);
    g.strokeStyle='#2e1f0e'; g.lineWidth=3; g.strokeRect(1,1,62,62);
    g.beginPath(); g.moveTo(0,0); g.lineTo(64,64); g.moveTo(64,0); g.lineTo(0,64); g.stroke();
  });
  // 6: 지옥 용암
  wallTex[6]=texCanvas(g=>{
    const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'#3a0a00'); gr.addColorStop(1,'#120302');
    g.fillStyle=gr; g.fillRect(0,0,64,64);
    for(let i=0;i<34;i++){ g.fillStyle=['#ff5a00','#ff8800','#ffcc33','#cc2200'][i%4]; const x=Math.random()*60|0,y=Math.random()*60|0; g.fillRect(x,y,3+Math.random()*5|0,2+Math.random()*4|0); }
    g.fillStyle='#000'; for(let i=0;i<8;i++) g.fillRect(Math.random()*64|0,Math.random()*64|0,6,3);
  });
  // 7: 문
  wallTex[7]=texCanvas(g=>{
    g.fillStyle='#33363c'; g.fillRect(0,0,64,64);
    g.fillStyle='#4a5058'; for(let i=0;i<4;i++) g.fillRect(6,4+i*15,52,11);
    g.fillStyle='#ffcc00'; g.fillRect(26,26,12,12); g.fillStyle='#000'; g.fillRect(29,29,6,6);
    g.fillStyle='#111'; g.fillRect(0,0,4,64); g.fillRect(60,0,4,64);
  });
  // 8: EXIT 초록
  wallTex[8]=texCanvas(g=>{
    g.fillStyle='#0a3a1a'; g.fillRect(0,0,64,64);
    g.fillStyle='#0f0'; g.fillRect(6,10,52,20);
    g.fillStyle='#021'; g.font='bold 13px monospace'; g.fillText('EXIT',12,25);
    g.fillStyle='#0a3a1a'; for(let i=0;i<8;i++) g.fillRect(6,34+i*4,52,2);
    g.fillStyle='#7f7'; for(let i=0;i<10;i++) g.fillRect(Math.random()*64|0,34+Math.random()*28|0,2,2);
  });
}

// ---------- 스프라이트 생성 ----------
function spriteCanvas(draw){
  const c=document.createElement('canvas'); c.width=64; c.height=64;
  draw(c.getContext('2d')); return c;
}
const SPR = {};
function buildSprites(){
  // 임프 (갈색 악마)
  const impBody=(g,atk,dead)=>{
    g.clearRect(0,0,64,64);
    if(dead){ g.fillStyle='#5a3018'; g.fillRect(8,48,48,10); g.fillStyle='#a00'; g.fillRect(10,48,44,4);
      g.fillStyle='#d8a070'; g.beginPath(); g.arc(20,50,7,0,7); g.fill();
      g.fillStyle='#000'; g.fillRect(17,48,6,2); return; }
    const bob = atk?-3:0;
    g.fillStyle='#7a4520'; g.fillRect(22,22+bob,20,28);           // torso
    g.fillStyle='#8f5628'; g.fillRect(16,30+bob,6,14); g.fillRect(42,30+bob,6,14); // arms
    g.fillStyle='#5a2c12'; g.fillRect(24,50,6,12); g.fillRect(34,50,6,12);         // legs
    g.fillStyle='#d8a070'; g.beginPath(); g.arc(32,14+bob,10,0,7); g.fill();       // head
    g.fillStyle='#fff'; g.beginPath(); g.arc(28,13+bob,3,0,7); g.arc(36,13+bob,3,0,7); g.fill();
    g.fillStyle='#ff0'; g.beginPath(); g.arc(28,13+bob,1.5,0,7); g.arc(36,13+bob,1.5,0,7); g.fill();
    g.fillStyle='#400'; g.fillRect(26,20+bob,12,3);                                        // mouth
    g.fillStyle='#e8c090'; g.beginPath(); g.moveTo(24,8+bob); g.lineTo(20,0); g.lineTo(28,6+bob); g.fill();
    g.beginPath(); g.moveTo(40,8+bob); g.lineTo(44,0); g.lineTo(36,6+bob); g.fill();
    if(atk){ g.fillStyle='#ff8800'; g.beginPath(); g.arc(48,34,6,0,7); g.fill(); g.fillStyle='#ff0'; g.beginPath(); g.arc(48,34,3,0,7); g.fill(); }
  };
  SPR.imp=[spriteCanvas(g=>impBody(g,false,false)),spriteCanvas(g=>{impBody(g,false,false);const x=g;x.fillStyle='rgba(255,255,255,.25)';x.fillRect(22,22,20,4);}),spriteCanvas(g=>impBody(g,true,false)),spriteCanvas(g=>impBody(g,false,true))];
  // 핑크 데몬
  const demonBody=(g,atk,dead)=>{
    g.clearRect(0,0,64,64);
    if(dead){ g.fillStyle='#c07090'; g.fillRect(6,46,52,12); g.fillStyle='#800'; g.fillRect(8,46,48,5);
      g.fillStyle='#e090a8'; g.beginPath(); g.arc(18,50,8,0,7); g.fill(); return; }
    const lunge=atk?4:0;
    g.fillStyle='#d07a96'; g.beginPath(); g.ellipse(32,36,18,14,0,0,7); g.fill();   // body
    g.fillStyle='#e89ab2'; g.beginPath(); g.arc(32+lunge,22,12,0,7); g.fill();      // head
    g.fillStyle='#fff'; g.beginPath(); g.arc(27+lunge,20,3.4,0,7); g.arc(37+lunge,20,3.4,0,7); g.fill();
    g.fillStyle='#f00'; g.beginPath(); g.arc(27+lunge,20,1.6,0,7); g.arc(37+lunge,20,1.6,0,7); g.fill();
    g.fillStyle='#600'; g.fillRect(24+lunge,28,16,atk?7:4);                          // jaw
    g.fillStyle='#fff'; for(let i=0;i<4;i++) g.fillRect(25+lunge+i*4,28,2,3);
    g.fillStyle='#f2d7c0'; g.beginPath(); g.moveTo(22,14); g.lineTo(16,2); g.lineTo(26,10); g.fill();
    g.beginPath(); g.moveTo(42,14); g.lineTo(48,2); g.lineTo(38,10); g.fill();
    g.fillStyle='#b05a76'; g.fillRect(14,44,8,12); g.fillRect(42,44,8,12);
  };
  SPR.demon=[spriteCanvas(g=>demonBody(g,false,false)),spriteCanvas(g=>{demonBody(g,false,false);}),spriteCanvas(g=>demonBody(g,true,false)),spriteCanvas(g=>demonBody(g,false,true))];
  // 카코데몬 (빨간 날으는 눈알)
  const cacoBody=(g,atk,dead)=>{
    g.clearRect(0,0,64,64);
    if(dead){ g.fillStyle='#a02020'; g.fillRect(10,44,44,12); g.fillStyle='#400'; g.fillRect(12,44,40,5); return; }
    const s=atk?2:0;
    g.fillStyle='#c03030'; g.beginPath(); g.arc(32,34,20-s,0,7); g.fill();

let AC=null, masterGain=null, musicTimer=null;
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain(); masterGain.gain.value=0.5; masterGain.connect(AC.destination);
    startMusic();
  }catch(e){}
}
function noiseBurst(dur,freq,vol){
  if(!AC) return;
  const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f); f.connect(g); g.connect(masterGain); src.start();
}
function tone(freq,dur,type,vol,slide){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.3,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(AC.currentTime+dur);
}
const SFX={
  pistol(){ noiseBurst(.12,3000,.5); tone(180,.1,'square',.3,60); },
  shotgun(){ noiseBurst(.3,1800,.8); tone(120,.25,'sawtooth',.5,40); },
  chaingun(){ noiseBurst(.08,4000,.4); tone(250,.06,'square',.25,100); },
  empty(){ tone(1200,.05,'square',.15); },
  edie(){ tone(400,.4,'sawtooth',.35,60); noiseBurst(.2,800,.3); },
  hurt(){ tone(200,.2,'sawtooth',.4,80); },
  pickup(){ tone(660,.08,'square',.25); setTimeout(()=>tone(990,.12,'square',.25),70); },
  door(){ tone(90,.5,'sawtooth',.3,180); noiseBurst(.3,500,.2); },
  exit(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.3),i*130)); },
  growl(){ tone(80,.5,'sawtooth',.25,50); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.35),i*150)); },
};
function startMusic(){
  if(!AC||musicTimer) return;
  let step=0;
  const bass=[55,55,65.4,49,55,55,73.4,65.4];
  musicTimer=setInterval(()=>{
    if(state!=='play'||!AC) return;
    const f=bass[step%bass.length];
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sawtooth'; o.frequency.value=f;
    g.gain.setValueAtTime(.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.22);
    o.connect(g); g.connect(masterGain); o.start(); o.stop(AC.currentTime+.25);
    if(step%4===0){ const h=AC.createOscillator(), hg=AC.createGain(); h.type='square'; h.frequency.value=f*4;
      hg.gain.setValueAtTime(.02,AC.currentTime); hg.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.1);
      h.connect(hg); hg.connect(masterGain); h.start(); h.stop(AC.currentTime+.12); }
    step++;
  },240);
}

const touch={mx:0,my:0,look:0,lookId:null,lx:0,fire:false};
(function(){

      if(t.identifier===touch.lookId) touch.lookId=null;

  });

function tryUse(){
  // 앞 1.5칸 문/EXIT 체크
  const fx=player.x+Math.cos(player.ang)*1.4, fy=player.y+Math.sin(player.ang)*1.4;
  const ix=Math.floor(fx), iy=Math.floor(fy);
  if(ix<0||iy<0||ix>=MW||iy>=MH) return;
  const v=grid[iy][ix];
  if(v===7){
    const d=doors.find(d=>d.x===ix&&d.y===iy);
    if(d&&!d.opening){ d.opening=true; SFX.door(); showMsg('문이 열린다...',1.2); }
  } else if(v===8){ winGame(); }
  else {
    // 주변 문 자동
    for(const d of doors){
      if(Math.hypot(d.x+.5-player.x,d.y+.5-player.y)<1.8&&!d.opening){ d.opening=true; SFX.door(); }
    }
  }
}
function winGame(){
  if(state!=='play') return;
  state='win'; SFX.win(); SFX.exit();
  document.exitPointerLock&&document.exitPointerLock();
  const kills=enemies.filter(e=>e.hp<=0).length;

}

// ---------- 발사 ----------
function shoot(){
  const w=WEAPONS[player.weapon];
  if(player.cd>0) return;
  if(player.ammo<=0){ SFX.empty(); player.cd=0.25; showMsg('탄약 없음! 탄약을 찾아라',1.2); return; }
  player.ammo--; player.cd=w.cd; muzzle=0.09; shake=Math.min(6,shake+(player.weapon===1?5:2));
  if(player.weapon===0) SFX.pistol(); else if(player.weapon===1) SFX.shotgun(); else SFX.chaingun();
  player.bob+=0.5;
  for(let p=0;p<w.pellets;p++){
    const a=player.ang+(Math.random()-0.5)*w.spread*2+(w.pellets>1?(Math.random()-0.5)*0.06:0);
    // 히트스캔: 가장 가까운 적
    let best=null,bestD=20;
    for(const e of enemies){
      if(e.hp<=0) continue;
      const dx=e.x-player.x, dy=e.y-player.y;
      const d=Math.hypot(dx,dy);
      if(d>20||d<0.2) continue;
      let da=Math.atan2(dy,dx)-a;
      while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
      if(Math.abs(da)<Math.atan2(0.45,d)){
        if(hasLOS(player.x,player.y,e.x,e.y)&&d<bestD){ bestD=d; best=e; }
      }
    }
    // 벽 거리 체크
    const wd=castSingle(a);
    if(best&&bestD<wd){
      const falloff=Math.max(0.35,1-bestD/22);
      const dmg=w.dmg*(0.8+Math.random()*0.4)*falloff;
      best.hp-=dmg; best.painT=0.15;
      blood(best.x,best.y,6);
      if(best.hp<=0&&best.state!=='dead'){ best.state='dead'; best.deadT=0; SFX.edie(); }
      else if(Math.random()<0.25) tone(150+Math.random()*100,.1,'square',.2,80);
    }
  }
}
function castSingle(a){
  const dx=Math.cos(a),dy=Math.sin(a);
  let x=player.x,y=player.y,d=0;
  while(d<DEPTH_MAX){ x+=dx*0.05; y+=dy*0.05; d+=0.05; if(isSolid(x,y)) return d; }
  return DEPTH_MAX;
}
function enemyShoot(e){
  const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
  shots.push({x:e.x,y:e.y,vx:dx/d*5,vy:dy/d*5,life:2.2,foe:true,dmg:e.dmg});
  tone(300,.2,'sawtooth',.2,120);
}
function blood(x,y,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:0.4+Math.random()*0.3,t:0,col:Math.random()<0.7?'#c00':'#800'});
}

// ---------- 업데이트 ----------
let lastT=performance.now();
function update(dt){
  if(state!=='play'||paused) return;
  elapsed+=dt;
  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) document.getElementById('msg').textContent=''; }
  // 이동
  const run=(keys['ShiftLeft']||keys['ShiftRight'])?1.7:1.0;
  const SPD=3.4*run;
  let fw=0,st=0,rot=0;
  if(keys['KeyW']||keys['ArrowUp']) fw+=1;
  if(keys['KeyS']||keys['ArrowDown']) fw-=1;
  if(keys['KeyA']) st-=1;
  if(keys['KeyD']) st+=1;
  if(keys['ArrowLeft']) rot-=1;
  if(keys['ArrowRight']) rot+=1;
  fw+=touch.my; st+=touch.mx;
  player.ang+=rot*2.6*dt;
  const mx=(Math.cos(player.ang)*fw+Math.cos(player.ang+Math.PI/2)*st)*SPD*dt;
  const my=(Math.sin(player.ang)*fw+Math.sin(player.ang+Math.PI/2)*st)*SPD*dt;
  if(!isSolid(player.x+mx*1.4,player.y)) player.x+=mx;
  if(!isSolid(player.x,player.y+my*1.4)) player.y+=my;
  if(fw||st) player.bob+=dt*9;
  // 발사
  player.cd-=dt;
  if((mouseDown||keys['Space']||touch.fire)){
    const w=WEAPONS[player.weapon];
    if(w.auto||!player._held){ shoot(); player._held=true; }
  } else player._held=false;
  if(muzzle>0)muzzle-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(player.hurtT>0)player.hurtT-=dt;
  // 문
  for(const d of doors){
    if(d.opening&&d.open<1){ d.open=Math.min(1,d.open+dt*1.2); if(d.open>=1) setTimeout(()=>{d.opening=false;},100); }
    else if(!d.opening&&d.open>0){
      // 플레이어 멀면 닫힘
      if(Math.hypot(d.x+.5-player.x,d.y+.5-player.y)>2.5) d.open=Math.max(0,d.open-dt*0.8);
    }
    // 가까이 자동오픈
    if(!d.opening&&d.open===0&&Math.hypot(d.x+.5-player.x,d.y+.5-player.y)<1.4){ d.opening=true; SFX.door(); }
  }
  // 적 AI
  for(const e of enemies){
    if(e.hp<=0){ if(e.deadT<1)e.deadT+=dt; continue; }
    e.anim+=dt*4;
    if(e.painT>0)e.painT-=dt;
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    const seen=d<14&&hasLOS(e.x,e.y,player.x,player.y);
    if(seen){
      if(e.state==='idle'){ e.state='chase'; if(Math.random()<0.3)SFX.growl(); }
    }
    if(e.state==='chase'&&seen){
      // 추적
      const sp=e.sp*dt;
      const nx=e.x+dx/d*sp, ny=e.y+dy/d*sp;
      if(d>0.7){
        if(!isSolid(nx,e.y))e.x=nx;
        if(!isSolid(e.x,ny))e.y=ny;
      }
      // 공격
      e.fireT-=dt;
      if(d<0.9){ // 근접
        e.atkT=0.3;
        if(e.fireT<=0){ e.fireT=1.0; hurtPlayer(e.dmg); }
      } else if(d<10&&e.fireT<=0&&(e.type!=='demon'||d<5)){
        e.atkT=0.35; e.fireT=e.type==='caco'?1.6:2.0+Math.random();
        if(e.type==='demon'){ hurtPlayer(e.dmg*0.7); noiseBurst(.15,600,.3); }
        else setTimeout(()=>{ if(e.hp>0&&state==='play') enemyShoot(e); },200);
      }
    }
    if(e.atkT>0)e.atkT-=dt;
  }
  // 적 투사체
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.life<=0||isSolid(s.x,s.y)){ shots.splice(i,1); continue; }
    const pd=Math.hypot(s.x-player.x,s.y-player.y);
    if(pd<0.4){ hurtPlayer(s.dmg*(0.8+Math.random()*0.4)); blood(player.x,player.y,4); shots.splice(i,1); }
  }
  // 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.t>p.life)particles.splice(i,1);
  }
  // 아이템
  for(const it of items){
    if(it.taken)continue;
    if(Math.hypot(it.x-player.x,it.y-player.y)<0.6){
      if(it.type==='medkit'){ if(player.hp>=100)continue; player.hp=Math.min(100,player.hp+25); flashHeal(); }
      else if(it.type==='ammo'){ if(player.ammo>=player.maxAmmo)continue; player.ammo=Math.min(player.maxAmmo,player.ammo+20); }
      else if(it.type==='armor'){ player.armor=Math.min(100,player.armor+50); }
      else if(it.type==='shotgun'){ if(player.hasShotgun){player.ammo=Math.min(player.maxAmmo,player.ammo+8);} else {player.hasShotgun=true;player.weapon=1;showMsg('산탄총 획득! [2]',2);} }
      else if(it.type==='chain'){ if(player.hasChain){player.ammo=Math.min(player.maxAmmo,player.ammo+15);} else {player.hasChain=true;player.weapon=2;showMsg('체인건 획득! [3]',2);} }
      it.taken=true; SFX.pickup();
      if(it.type==='medkit')showMsg('+25 HEALTH',1);
    }
  }
  // EXIT 도달 체크
  {
    const ix=Math.floor(player.x),iy=Math.floor(player.y);
    if(ix>=0&&iy>=0&&ix<MW&&iy<MH&&grid[iy][ix]===8) winGame();
  }
  // 얼굴
  player.faceT+=dt;
  updateHUD();
}
function hurtPlayer(dmg){
  if(state!=='play')return;
  if(player.armor>0){ const ab=Math.min(player.armor,dmg*0.5); player.armor-=ab; dmg-=ab; }
  player.hp-=dmg; player.hurtT=0.35; shake=Math.min(8,shake+4);
  SFX.hurt();
  const f=document.getElementById('damage-flash'); f.style.opacity=0.9; setTimeout(()=>f.style.opacity=0,120);
  if(player.hp<=0){ player.hp=0; updateHUD(); die(); }
}
function flashHeal(){ const f=document.getElementById('heal-flash'); f.style.opacity=1; setTimeout(()=>f.style.opacity=0,300); }
function updateHUD(){
  document.getElementById('h-ammo').textContent=player.ammo;
  document.getElementById('h-hp').textContent=Math.max(0,Math.ceil(player.hp))+'%';
  document.getElementById('h-hp').style.color=player.hp>60?'#ff2222':player.hp>25?'#ff8800':'#ff0000';
  document.getElementById('h-armor').textContent=Math.ceil(player.armor)+'%';
  document.getElementById('weapon-name').textContent=WEAPONS[player.weapon].name;
  const kills=enemies.filter(e=>e.hp<=0).length;
  document.getElementById('killcount').textContent=`KILLS ${kills}/${enemies.length}`;
  const fc=document.getElementById('face');
  fc.textContent=player.hp>75?'😐':player.hp>40?'😠':player.hp>15?'🤕':'💀';
}

// ---------- 렌더 ----------
const mm=document.getElementById('minimap').getContext('2d');
function render(){
  // 흔들림
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // 천장/바닥
  const bobY=Math.sin(player.bob)*3;
  const horizon=HALF_H+Math.sin(player.bob*0.5)*2;
  let cg=ctx.createLinearGradient(0,0,0,horizon);
  cg.addColorStop(0,'#050508'); cg.addColorStop(1,muzzle>0?'#4a3a2a':'#2a1a12');
  ctx.fillStyle=cg; ctx.fillRect(-10,-10,W+20,horizon+10);
  let fg=ctx.createLinearGradient(0,horizon,0,H);
  fg.addColorStop(0,muzzle>0?'#5a5a4a':'#3a3a3a'); fg.addColorStop(.3,'#222'); fg.addColorStop(1,'#0a0a0a');
  ctx.fillStyle=fg; ctx.fillRect(-10,horizon,W+20,H-horizon+20);
  // 레이캐스트
  for(let i=0;i<NUM_RAYS;i++){
    const camX=(i/NUM_RAYS-0.5)*2;                 // -1..1
    const rayA=player.ang+Math.atan(camX*Math.tan(HALF_FOV));
    const dx=Math.cos(rayA),dy=Math.sin(rayA);
    // DDA
    let mx=Math.floor(player.x),my=Math.floor(player.y);
    const ddx=Math.abs(1/(dx||1e-9)),ddy=Math.abs(1/(dy||1e-9));
    let sx,sy,sdx,sdy,side=0,texId=1;
    if(dx<0){sx=-1;sdx=(player.x-mx)*ddx;}else{sx=1;sdx=(mx+1-player.x)*ddx;}
    if(dy<0){sy=-1;sdy=(player.y-my)*ddy;}else{sy=1;sdy=(my+1-player.y)*ddy;}
    let dist=0,hit=false,doorOff=0;
    for(let s=0;s<64;s++){
      if(sdx<sdy){dist=sdx;sdx+=ddx;mx+=sx;side=0;}else{dist=sdy;sdy+=ddy;my+=sy;side=1;}
      if(mx<0||my<0||mx>=MW||my>=MH){dist=Math.min(dist,DEPTH_MAX);texId=1;hit=true;break;}
      const v=grid[my][mx];
      if(v!==0){
        texId=v;
        if(v===7){
          const d=doors.find(d=>d.x===mx&&d.y===my);
          if(d&&d.open>0.05){
            // 열린 문은 얇게 통과 판정: 간단히 무시하고 계속 (열림)
            if(d.open>0.65) continue;
          }
        }
        hit=true; break;
      }
    }
    // 어안 보정
    let perp=dist*Math.cos(rayA-player.ang);
    perp=Math.max(0.05,perp);
    zbuffer[i]=perp;
    const lineH=Math.min(H*4,H/perp);
    const y0=horizon-lineH/2+bobY;
    // 텍스처 X
    let wallX=side===0?player.y+perp*Math.sin(rayA):player.x+perp*Math.cos(rayA);
    wallX-=Math.floor(wallX);
    let tx=(wallX*TEX)|0;
    if((side===0&&dx>0)||(side===1&&dy<0)) tx=TEX-1-tx;
    // 음영
    const shade=Math.max(0.15,Math.min(1,1.6/perp));
    const sideShade=side===1?0.75:1.0;
    const tex=wallTex[texId]||wallTex[1];
    const sx0=i*COL_W;
    ctx.drawImage(tex,tx,0,1,TEX,sx0,y0,COL_W+1,lineH);
    ctx.fillStyle=`rgba(0,0,0,${(1-shade*sideShade).toFixed(3)})`;
    ctx.fillRect(sx0,y0,COL_W+1,lineH);
    if(muzzle>0){ ctx.fillStyle=`rgba(255,200,120,${(0.12*Math.max(0,1-perp/8)).toFixed(3)})`; ctx.fillRect(sx0,y0,COL_W+1,lineH); }
  }
  renderSprites(horizon,bobY);
  renderWeapon(bobY);
  ctx.restore();
  if(showMap) renderMinimap();
  // FPS
  fpsN++; const now=performance.now();
  if(now-fpsT>500){ document.getElementById('fps').innerHTML=`FPS ${Math.round(fpsN*1000/(now-fpsT))}<br>${elapsed.toFixed(0)}s`; fpsN=0; fpsT=now; }
}
let fpsN=0,fpsT=performance.now();

function spriteFrame(e){
  if(e.hp<=0) return 3;
  if(e.atkT>0) return 2;
  if(e.painT>0) return 2;
  return ((e.anim|0)%2);
}
function renderSprites(horizon,bobY){
  const list=[];
  for(const e of enemies){ if(e.deadT>4)continue; list.push({x:e.x,y:e.y,e}); }
  for(const it of items){ if(it.taken)continue; list.push({x:it.x,y:it.y,it}); }
  for(const s of shots) list.push({x:s.x,y:s.y,s});
  // EXIT 표시
  list.sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y));
  const sin=Math.sin(player.ang),cos=Math.cos(player.ang);
  for(const o of list){
    const dx=o.x-player.x, dy=o.y-player.y;
    const dist=Math.hypot(dx,dy);
    if(dist<0.15||dist>DEPTH_MAX)continue;
    const inv=1/(cos*cos+sin*sin);
    const tx=inv*(dy*cos-dx*sin), ty=inv*(dx*cos+dy*sin); // ty = depth
    if(ty<=0.1)continue;
    const sx=(0.5+tx/ty*0.866)*W; // 화면 x (FOV 60도 보정)
    // 크기
    let scale=H/ty;
    let img,label=null;
    if(o.e){ const e=o.e; img=SPR[e.type][spriteFrame(e)]; scale*=e.type==='caco'?1.1:0.95; if(e.hp>0&&e.hp<e.maxhp){label=`${e.hp/e.maxhp}`;} }
    else if(o.it){ const t=o.it.type; img=t==='medkit'?SPR.medkit:t==='ammo'?SPR.ammo:t==='armor'?SPR.armor:t==='shotgun'?SPR.shotgun:SPR.armor; if(t==='chain'){img=SPR.shotgun;} scale*=0.55; }
    else if(o.s){ img=SPR.fireball; scale*=0.5; }
    const w=scale, h=scale;
    const yBase=horizon+h/2-(scale*0.08)+bobY+(o.it?Math.sin(performance.now()/300+o.x)*5:0);
    const x0=sx-w/2;
    // 컬럼 단위 depth test
    const step=Math.max(1,COL_W);
    for(let x=Math.max(0,x0|0);x<Math.min(W,x0+w);x+=step){
      const rayIdx=Math.min(NUM_RAYS-1,Math.max(0,(x/W*NUM_RAYS)|0));
      if(ty>=zbuffer[rayIdx])continue;
      const u=(x-x0)/w;
      const su=(u*64)|0;
      ctx.drawImage(img,su,0,1,64,x,yBase-h,w<=0?1:step+0.5,h);
    }
    // 체력바
    if(label){
      const bw=40,bx=sx-bw/2,by=yBase-h-8;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(bx,by,bw,4);
      ctx.fillStyle='#f00'; ctx.fillRect(bx,by,bw*parseFloat(label),4);
    }
  }
  // 파티클 (바닥 혈흔 느낌: 작은 사각형 투영)
  for(const p of particles){
    const dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);
    if(d>12)continue;
    const a=Math.atan2(dy,dx)-player.ang;
    let da=a; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
    if(Math.abs(da)>HALF_FOV+0.2)continue;
    const sx=(0.5+da/FOV)*W, sy=horizon+(H/d)*0.25+bobY;
    const s=Math.max(2,60/d*(1-p.t/p.life));
    ctx.fillStyle=p.col; ctx.fillRect(sx,sy,s,s);
  }
}

// 무기 렌더 (절차적 도트건)
function renderWeapon(bobY){
  const w=WEAPONS[player.weapon];
  const bx=W/2+Math.sin(player.bob)*8, by=H+Math.abs(Math.sin(player.bob))*10+bobY*0.3;
  const firing=muzzle>0;
  ctx.save();
  ctx.translate(bx,by);
  if(player.weapon===0){
    // 권총
    ctx.fillStyle='#222'; ctx.fillRect(-14,-120,28,120);
    ctx.fillStyle='#555'; ctx.fillRect(-14,-120,28,14);
    ctx.fillStyle='#7a4a22'; ctx.fillRect(-12,-60,24,60);
    if(firing){ ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(0,-135,22+Math.random()*8,0,7); ctx.fill();
      ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.arc(0,-135,12,0,7); ctx.fill(); }
  } else if(player.weapon===1){
    // 샷건 (더블배럴)
    ctx.fillStyle='#5a3010'; ctx.fillRect(-26,-110,52,110);
    ctx.fillStyle='#888'; ctx.fillRect(-18,-170,12,80); ctx.fillRect(6,-170,12,80);
    ctx.fillStyle='#333'; ctx.fillRect(-20,-172,14,10); ctx.fillRect(6,-172,14,10);
    if(firing){ ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(0,-190,34,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-190,16,0,7); ctx.fill(); }
  } else {
    // 체인건
    ctx.fillStyle='#333'; ctx.fillRect(-20,-110,40,110);
    ctx.fillStyle='#666'; ctx.fillRect(-8,-170,16,70);
    ctx.fillStyle='#111'; for(let i=0;i<4;i++) ctx.fillRect(-8,-170+i*18,16,4);
    if(firing){ const o=Math.random()*6; ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(o,-185,20,0,7); ctx.fill(); }
  }
  ctx.restore();
  // 머즐 조명
  if(firing){ ctx.fillStyle='rgba(255,200,100,.08)'; ctx.fillRect(0,0,W,H); }
}

function renderMinimap(){
  const s=144, sc=s/MW;
  mm.clearRect(0,0,s,s);
  mm.fillStyle='rgba(0,0,0,.8)'; mm.fillRect(0,0,s,s);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const v=grid[y][x];
    if(v===0)continue;
    mm.fillStyle=v===8?'#0f0':v===7?'#fc0':['','#888','#a86','#a33','#3d6','#a72','#f50'][v]||'#888';
    mm.fillRect(x*sc,y*sc,sc,sc);
  }
  mm.fillStyle='#0ff';
  for(const it of items){ if(it.taken)continue; mm.fillRect(it.x*sc-1,it.y*sc-1,2,2); }
  mm.fillStyle='#f00';
  for(const e of enemies){ if(e.hp<=0)continue; mm.fillRect(e.x*sc-1.5,e.y*sc-1.5,3,3); }
  // 플레이어
  mm.save(); mm.translate(player.x*sc,player.y*sc); mm.rotate(player.ang);
  mm.fillStyle='#ff0'; mm.beginPath(); mm.moveTo(5,0); mm.lineTo(-3,-3); mm.lineTo(-3,3); mm.fill(); mm.restore();
}

// ---------- 힌트 ----------
let hintShown=false;
function hint(t,ms){
  const h=document.getElementById('hint'); h.textContent=t; h.style.display='block';
  clearTimeout(h._t); h._t=setTimeout(()=>h.style.display='none',ms||3000);
}

// ---------- 메인 루프 ----------
function loop(){
  const now=performance.now();
  let dt=(now-lastT)/1000; lastT=now;
  dt=Math.min(0.05,dt);
  if(state==='play'&&!paused) update(dt);
  if(state!=='title') render();
  requestAnimationFrame(loop);
}

// 부트
buildTextures(); buildSprites(); buildGrid();
(function(){ const s=playerStart(); player={x:s.x,y:s.y,ang:0,hp:100,armor:0,ammo:50,weapon:0,hasShotgun:false,hasChain:false,cd:0,bob:0,hurtT:0}; enemies=[];items=[];shots=[];particles=[]; })();
updateHUD();
requestAnimationFrame(loop);
// 타이틀 배경 살짝 렌더
setInterval(()=>{ if(state==='title'){ player.ang+=0.002; } },16);
window.addEventListener('pointerlockchange',()=>{
  if(state==='play'&&!document.pointerLockElement&&!('ontouchstart' in window)&&!hintShown){
    // hintShown=true; hint('클릭하면 마우스 조준이 잠깁니다',2500);
  }
});
